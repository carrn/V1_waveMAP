[project]
name = "laminar-features"
version = "0.1.0"
description = "Laminar-position (and NuCLR) features for WaveMAP clustering of monkey V1 neurons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "networkx>=2.8",
    "numpy<2",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "setuptools<80",
    "umap-learn==0.5.3",
]
